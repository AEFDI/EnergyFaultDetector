train:
  anomaly_score:
    name: rmse
    params:
      scale: false
  autoencoder:
    name: default
    params:
      batch_size: 16
      code_size: 3
      early_stopping: false
      epochs: 1
      layers:
      - 8
      learning_rate: 0.001
      loss_name: mean_squared_error
    verbose: 0
  data_preprocessor: null
  data_splitter:
    shuffle: false
    type: sklearn
    validation_split: 0.2
  protect_conditional_features: false
  threshold_selector:
    fit_on_val: false
    name: quantile
    params:
      quantile: 0.95
