train:
  anomaly_score:
    name: 'weighted_rmse'
    params:
      feature_weights:
        a: 2.0
        b: 1.0
        c: 0.5
  data_preprocessor:  # no further spec, so defaults are applied
  autoencoder:
    name: 'MultilayerAutoencoder'
    verbose: 0
    params:
      layers: [300]
      code_size: 50
      learning_rate: 0.001
      decay_rate: 0.001
      decay_steps: 100
      batch_size: 144
      epochs: 10
      loss_name: 'mean_squared_error'
  threshold_selector:
    name: 'FDR'
    params:
      target_false_discovery_rate: 0.8
  data_splitter:
    train_block_size: 7
    val_block_size: 3
  data_clipping:
    lower_percentile: 0.01
    upper_percentile: 0.99

root_cause_analysis:
  alpha: 0.8
  init_x_bias: recon
  num_iter: 200
